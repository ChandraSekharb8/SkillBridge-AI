<!DOCTYPE html>
<html>
<head><title>Ask SkillBridge AI</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<nav class="navbar"><div class="logo">SkillBridge <span>AI</span></div><div class="nav-links" id="navLinks"></div></nav>
<section class="tool-page-section">
    <div class="tool-page-header"><p class="tagline">Ask SkillBridge AI</p><h1>Your Student-Friendly AI Doubt Solver</h1><p>Ask Java, Spring Boot, DSA, SQL, project, resume, interview, and placement questions.</p></div>
    <div class="tool-panel"><div id="chatBox" class="chat-box"><div class="chat-message ai-message">Hi, I am SkillBridge AI. Ask me anything about coding, projects, interviews, or placements.</div></div><textarea id="chatQuestion" placeholder="Example: Explain Spring Boot project workflow in simple words."></textarea><div class="chat-actions"><button onclick="askSkillBridgeChat()">Send Message</button><button onclick="clearSkillBridgeChat()" class="secondary-btn">Clear Chat</button></div></div>
</section>
<script src="js/navbar.js"></script><script src="js/ask-ai.js"></script>
</body>
</html>
